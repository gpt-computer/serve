[build-system]
requires = ["setuptools>=84.1.0", "wheel", "setuptools-golang"]
build-backend = "setuptools.build_meta"

[project]
name = "gptc"
version = "1.0.1"
description = "Multimodal AI services & pipelines with cloud-native stack: gRPC, Kubernetes, Docker, OpenTelemetry, Prometheus, Jaeger, etc."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache 2.0"}
authors = [{name = "GPT::C0MPUTΞR", email = "hello@khulnasoft.com"}]
keywords = [
    "gptc", "cloud-native", "cross-modal", "multimodal", "neural-search",
    "query", "search", "index", "elastic", "neural-network", "encoding",
    "embedding", "serving", "docker", "container", "image", "video", "audio",
    "deep-learning", "mlops",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Unix Shell",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "docarray>=0.21.1",
    "gptc-hubble-sdk>=0.10.0",
    "grpcio>=1.68.0",
    "grpcio-health-checking>=1.62.3",
    "grpcio-reflection>=1.62.3",
    "jcloud>=0.3",
    "numpy>=1.24.4",
    "opentelemetry-api>=1.33.1",
    "packaging>=26.2",
    "protobuf>=5.29.6",
    "pydantic>=1.10.27",
    "pyyaml>=6.0.3",
    "urllib3>=2.8.0",
]

[project.urls]
Documentation = "https://gpt-computer.github.io/serve"
Source = "https://github.com/gpt-computer/gptc/"
Tracker = "https://github.com/gpt-computer/gptc/issues"
