# Add 'label1' to any changes within 'example' folder or any subfolders
area/docs:
  - docs/**/*
  - ./*.md

area/testing:
  - tests/**/*

area/setup:
  - setup.py
  - extra-requirements.txt
  - requirements.txt
  - MANIFEST.in
  - docs/fastentrypoints.py

area/core:
  - gptc/**/*

area/helper:
  - gptc/*.py

area/entrypoint:
  - gptc/__init__.py


area/network:
  - gptc/peapods/**/*
  - gptc/proto/**/*

area/housekeeping:
  - .github/**/*
  - ./.gitignore

area/cicd:
  - .github/workflows/**/*

area/docker:
  - docker/**/*
  - ./.dockerignore

area/cli:
  - gptc_cli/**/*

area/docarray:
  - docarray/**/*

area/script:
  - script/**/*

component/client:
