[project.scripts]
gptc = "gptc_cli:main"

[dependency-groups]
test = [
    "scipy>=1.6.1",
    "Pillow",
    "pytest<8.0.0",
    "pytest-timeout",
    "pytest-mock",
    "pytest-cov==3.0.0",
    "coverage==6.2",
    "pytest-repeat",
    "pytest-asyncio<0.23.0",
    "pytest-reraise",
    "flaky",
    "mock",
    "requests-mock",
    "pytest-custom_exit_code",
    "black==24.3.0",
    "kubernetes>=18.20.0,<31.0.0",
    "pytest-kind==22.11.1",
    "pytest-lazy-fixture",
    "psutil",
    "opentelemetry-test-utils>=0.33b0",
    "prometheus-api-client>=0.5.1",
]
devel = [
    "pre-commit",
    "watchfiles>=0.18.0",
    "strawberry-graphql>=0.96.0",
    "sgqlc",
]
cicd = [
    "torch",
    "strawberry-graphql>=0.96.0",
    "sgqlc",
    "bs4",
    "jsonschema",
    "portforward>=0.2.4,<0.4.3",
    "tensorflow>=2.0",
]
dev = [
    {include-group = "test"},
    {include-group = "devel"},
]

[tool.uv]
default-groups = ["dev"]
constraint-dependencies = ["docarray>=0.16.4", "pydantic<2", "gptc-hubble-sdk==0.10.0"]

[tool.uv.sources]

[tool.setuptools.packages.find]
include = ["gptc*", "gptc_cli*"]

[tool.black]
line-length = 88
skip-string-normalization = true
extend-exclude = "gptc/proto|gptc/serve/consensus/add_voter|docs/conf.py"

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
