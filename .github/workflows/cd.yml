name: CD

on:
  push:
    branches:
      - master

#on:
#  push:
#    branches-ignore:
#      - '**'  # temporally ignore all


jobs:
  update-schema:
    if: |
      !startsWith(github.event.head_commit.message, 'chore') &&
      !startsWith(github.event.head_commit.message, 'build: hotfix') &&
      !endsWith(github.event.head_commit.message, 'reformatted by gptc-dev-bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
#          submodules: true
          fetch-depth: 100
      - run: |
          truncate --size=24KB README.md > README-trunc.md
      - uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_DEVBOT_USER  }}
          password: ${{ secrets.DOCKERHUB_DEVBOT_PWD }}
          repository: gptcomputer/gptc
          readme-filepath: ./README-trunc.md
      - uses: actions/checkout@v4
        with:
          repository: gpt-computer/api
          path: schema
          token: ${{ secrets.GPTC_DEV_BOT }}
      - uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - uses: actions/setup-node@v2
        with:
          node-version: '14'
      - run: |
          pip install . --no-cache-dir
          pip install docarray==0.21.0 # only valid for this version. I think we should remove this schema loading
          pip install docarray==1.10.3
          GPTC_VERSION=$(sed -n '/^__version__/p' ./gptc/__init__.py | cut -d \' -f2)-master
          echo "GPTC_VERSION=${GPTC_VERSION}" >> $GITHUB_ENV
          cd schema
          mkdir -p schemas
          gptc export schema --schema-path schemas/"$GPTC_VERSION.json" schemas/master.json schemas/master --yaml-path "$GPTC_VERSION.yml" master.yml --json-path "$GPTC_VERSION.json" master.json master
          python ../scripts/get-openapi-schemas.py
          npm install --prefix ~ snippet-enricher-cli
          ~/node_modules/.bin/snippet-enricher-cli --input=gateway.json --targets=shell_curl > gateway-with-code.json
          cd -
      - name: redoc-cli-gateway
        uses: seeebiii/redoc-cli-github-action@v10
        with:
          args: 'bundle schema/gateway-with-code.json -o rest.html'
      - name: push-to-api-repo
        run: |
          mkdir -p schema/rest/
          cp rest.html schema/rest/master.html
          cp schema/gateway.json schema/rest/master.json
          rm schema/gateway.json schema/gateway-with-code.json
          cd schema
          git config --local user.email "dev-bot@khulnasoft.com"
          git config --local user.name "Gptc Dev Bot"
          if [[ `git status --porcelain` ]]; then
            git pull && git add . && git commit -m "update ${{env.GPTC_VERSION}} due to ${{github.event_name}} on ${{github.repository}}" && git push
          fi

  update-docker:
    needs: update-schema
    runs-on: ubuntu-latest
    steps:
      - uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Manual Docker Build
          inputs: '{ "release_token": "${{ env.release_token }}", "triggered_by": "CD"}'
          token: ${{ secrets.GPTC_DEV_BOT }}
        env:
          release_token: ${{ secrets.GPTC_CORE_RELEASE_TOKEN }}

  prep-testbed:
    runs-on: ubuntu-latest
    needs: update-schema
    env:
      release_token: ${{ secrets.GPTC_CORE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          sudo apt-get install jq
          export value=$(bash scripts/get-all-test-paths.sh)
          echo "matrix=$value" >> $GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  docarray-v-two-test:
    needs: prep-testbed
    runs-on: ubuntu-latest
    env:
      GPTC_RANDOM_PORT_MIN: 16384
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        protobuf-version: ['==3.19.6', '']
        pydantic-version: ['==1.10.3', '<3.0.0']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Golang
        uses: actions/setup-go@v2
        with:
          go-version: 1.19.5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install git+https://github.com/gpt-computer/setuptools-golang.git@feat-align-with-alaeddine-code
          pip install cibuildwheel

      - name: Build wheels with setuptools-golang-build-manylinux-wheel
        run: |
          setuptools-golang-build-manylinux-wheels --pythons cp310-cp310
      - name: Prepare environment
        run: |
          # Take into account in the `test-pip` the versions
          docker build --build-arg PYDANTIC_VERSION="${{ matrix.pydantic-version }}" -f Dockerfiles/test-pip.Dockerfile -t gptcomputer/gptc:test-pip .
          python -m pip install --upgrade pip
          python -m pip install wheel
          WHEEL_FILE=$(ls dist/*whl)
          pip install "$WHEEL_FILE[standard,devel,test]" --no-cache-dir
          if [[ "${{ matrix.protobuf-version }}" == "==3.19.6" ]]; then
            pip install -U protobuf${{ matrix.protobuf-version }} grpcio==1.47.5 grpcio-reflection==1.47.5 grpcio-health-checking==1.47.5
          else
            pip install -U protobuf${{ matrix.protobuf-version }} grpcio==1.65.5 grpcio-reflection==1.65.5 grpcio-health-checking==1.65.5
          fi
          pip install pydantic"${{ matrix.pydantic-version }}"
          gptc
          export GPTC_LOG_LEVEL="ERROR"
      - name: Test
        id: test
        run: |
          pytest --cov=gptc --cov-report=xml --timeout=600 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' tests/unit/serve/runtimes/test_helper.py
          pytest --cov=gptc --cov-report=xml --timeout=600 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' tests/integration/deployment_http_composite
          pytest --cov=gptc --cov-report=xml --timeout=600 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' tests/integration/docarray_v2/test_singleton.py
          pytest --cov=gptc --cov-report=xml --timeout=600 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' tests/integration/docarray_v2/test_parameters_as_pydantic.py
          pytest --cov=gptc --cov-report=xml --timeout=600 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' tests/integration/docarray_v2/test_streaming.py
          pytest --cov=gptc --cov-report=xml --timeout=600 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' tests/integration/docarray_v2/csp
          pytest --cov=gptc --cov-report=xml --timeout=600 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' tests/integration/docarray_v2/docker
          pytest --cov=gptc --cov-report=xml --timeout=600 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' tests/integration/docarray_v2/test_v2.py
          pytest --cov=gptc --cov-report=xml --timeout=600 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' tests/integration/docarray_v2/test_errors.py
          echo "flag it as gptc for codeoverage"
          echo "codecov_flag=gptc" >> $GITHUB_OUTPUT
        timeout-minutes: 60
        env:
          GPTC_AUTH_TOKEN: "${{ secrets.GPTC_AUTH_TOKEN }}"
      - name: Check codecov file
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: "coverage.xml"
      - name: Upload coverage from test to Codecov
        uses: codecov/codecov-action@v3.1.1
        if: steps.check_files.outputs.files_exists == 'true'
        with:
          file: coverage.xml
          name: ${{ github.job }}-codecov
          flags: ${{ github.job }}
          fail_ci_if_error: false


  stateful-docarray-v-two-test:
    needs: prep-testbed
    runs-on: ubuntu-latest
    env:
      GPTC_RANDOM_PORT_MIN: 16384
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        protobuf-version: ['==3.19.6', '']
        pydantic-version: ['==1.10.3', '<3.0.0']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Golang
        uses: actions/setup-go@v2
        with:
          go-version: 1.19.5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install git+https://github.com/gpt-computer/setuptools-golang.git@feat-align-with-alaeddine-code
          pip install cibuildwheel

      - name: Build wheels with setuptools-golang-build-manylinux-wheel
        run: |
          setuptools-golang-build-manylinux-wheels --pythons cp310-cp310
      - name: Prepare environment
        run: |
          # Take into account in the `test-pip` the versions
          docker build --build-arg PYDANTIC_VERSION="${{ matrix.pydantic-version }}" -f Dockerfiles/test-pip.Dockerfile -t gptcomputer/gptc:test-pip .
          python -m pip install --upgrade pip
          python -m pip install wheel
          WHEEL_FILE=$(ls dist/*whl)
          pip install "$WHEEL_FILE[standard,devel,test]" --no-cache-dir
          if [[ "${{ matrix.protobuf-version }}" == "==3.19.6" ]]; then
            pip install -U protobuf${{ matrix.protobuf-version }} grpcio==1.47.5 grpcio-reflection==1.47.5 grpcio-health-checking==1.47.5
          else
            pip install -U protobuf${{ matrix.protobuf-version }} grpcio==1.65.5 grpcio-reflection==1.65.5 grpcio-health-checking==1.65.5
          fi
          pip install pydantic"${{ matrix.pydantic-version }}"
          gptc
          export GPTC_LOG_LEVEL="ERROR"
      - name: Test stateful
        id: test_stateful
        run: |
          GPTC_LOG_LEVEL=DEBUG GPTC_RANDOM_PORT_MAX="60535" pytest --maxfail 1 --cov=gptc --cov-report=xml --timeout=600 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' tests/integration/stateful
          echo "flag it as gptc for codeoverage"
          echo "codecov_flag=gptc" >> $GITHUB_OUTPUT
        timeout-minutes: 30
        env:
          GPTC_AUTH_TOKEN: "${{ secrets.GPTC_AUTH_TOKEN }}"
      - name: Check codecov file
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: "coverage.xml"
      - name: Upload coverage from test to Codecov
        uses: codecov/codecov-action@v3.1.1
        if: steps.check_files.outputs.files_exists == 'true'
        with:
          file: coverage.xml
          name: ${{ github.job }}-codecov
          flags: ${{ github.job }}
          fail_ci_if_error: false


  mark-dev-N:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - id: computedevdelta
        run: |
          git fetch --depth=200
          LAST_VER=$(git tag -l | sort -V | tail -n1)
          COMMITS_SINCE_LAST_VER=$(git rev-list $LAST_VER..HEAD --count)
          echo "devdelta=$COMMITS_SINCE_LAST_VER" >> $GITHUB_OUTPUT
          INIT_FILE='gptc/__init__.py'
          RELEASE_VER=$(sed -n '/^__version__/p' $INIT_FILE | cut -d \' -f2)
          echo "LAST_VER $LAST_VER"
          echo "COMMITS_SINCE_LAST_VER $COMMITS_SINCE_LAST_VER"
          echo "RELEASE_VER $RELEASE_VER"
          echo "devdelta=$COMMITS_SINCE_LAST_VER" >> $GITHUB_OUTPUT
          echo "releasever=$RELEASE_VER" >> $GITHUB_OUTPUT
    outputs:
      devdelta: ${{ steps.computedevdelta.outputs.devdelta }}
      releasever: ${{ steps.computedevdelta.outputs.releasever }}

  # Build the wheels for Linux and macOS for Python 3.8 and newer
  build-wheels:
    runs-on: ${{ matrix.os }}
    needs: [mark-dev-N]
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        include:
          # linux
          - os: ubuntu-latest
            python: '3.8'
            python-manylinux-tag: "cp38-cp38"
          - os: ubuntu-latest
            python: '3.9'
            python-manylinux-tag: "cp39-cp39"
          - os: ubuntu-latest
            python: '3.10'
            python-manylinux-tag: "cp310-cp310"
          - os: ubuntu-latest
            python: '3.11'
            python-manylinux-tag: "cp311-cp311"

          # MacOS emulated
          - os: macos-latest
            python: '3.8'
            python-cibuildwheels: '38'
            platform_id: macosx_x86_64
            arch: x86_64
            goarch: amd64
          - os: macos-latest
            python: '3.9'
            python-cibuildwheels: '39'
            platform_id: macosx_x86_64
            arch: x86_64
            goarch: amd64
          - os: macos-latest
            python: '3.10'
            python-cibuildwheels: '310'
            platform_id: macosx_x86_64
            arch: x86_64
            goarch: amd64
          - os: macos-latest
            python: '3.11'
            python-cibuildwheels: '311'
            platform_id: macosx_x86_64
            arch: x86_64
            goarch: amd64

          # MacOS native
          - os: macos-latest
            python: '3.8'
            python-cibuildwheels: '38'
            platform_id: macosx_arm64
            arch: arm64
            goarch: arm64
          - os: macos-latest
            python: '3.9'
            python-cibuildwheels: '39'
            platform_id: macosx_arm64
            arch: arm64
            goarch: arm64
          - os: macos-latest
            python: '3.10'
            python-cibuildwheels: '310'
            platform_id: macosx_arm64
            arch: arm64
            goarch: arm64
          - os: macos-latest
            python: '3.11'
            python-cibuildwheels: '311'
            platform_id: macosx_arm64
            arch: arm64
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Golang
        uses: actions/setup-go@v2
        with:
          go-version: 1.19.5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install git+https://github.com/gpt-computer/setuptools-golang.git@feat-align-with-alaeddine-code
          pip install cibuildwheel

      - name: Update version
        run: |
          DEVDELTA=${{needs.mark-dev-N.outputs.devdelta}}
          RELEASE_VER=${{needs.mark-dev-N.outputs.releasever}}
          INIT_FILE='gptc/__init__.py'
          DEV_VER=$RELEASE_VER".dev"$DEVDELTA
          echo "DEVDELTA $DEVDELTA"
          echo "RELEASE_VER $RELEASE_VER"
          echo "DEV_VER $DEV_VER"
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            sed -i '' '/'"${RELEASE_VER}"'/s/.*/'"__version__ = '${DEV_VER}'"'/' "${INIT_FILE}"
          else
            sed -i '/'"${RELEASE_VER}"'/s/.*/'"__version__ = '${DEV_VER}'"'/' "${INIT_FILE}"
          fi

      - name: Build wheels with setuptools-golang-build-manylinux-wheel
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          setuptools-golang-build-manylinux-wheels --pythons ${{ matrix.python-manylinux-tag }}

      - name: Build wheels with cibuildwheels on macos
        env:
          CIBW_BUILD: cp${{ matrix.python-cibuildwheels }}-${{ matrix.platform_id }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_TEST_COMMAND: python -c "import gptc; import jraft"
          CIBW_BUILD_VERBOSITY: 1
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          python -m cibuildwheel --output-dir dist

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ strategy.job-index }}
          path: dist/*.whl

