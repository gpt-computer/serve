name: Nightly Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        default: master
  schedule:
    - cron: "0 6 * * 1-5"   # runs at 6AM UTC (mon-fri)
  # pull_request:             # uncomment this if you want to run nightly tests in your PR

jobs:
  prep-testbed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          sudo apt-get install jq
          export value=$(bash scripts/get-all-test-paths.sh windows)
          echo "windows=$value" >> $GITHUB_OUTPUT
    outputs:
      windows: ${{ steps.set-matrix.outputs.windows }}

  windows-test:
    needs: prep-testbed
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.8, 3.10]
        test-path: ${{fromJson(needs.prep-testbed.outputs.windows)}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Prepare envionment
        run: |
          docker build -f docker/test-pip.Dockerfile -t gptcomputer/gptc:test-pip .
          python -m pip install --upgrade pip
          python -m pip install wheel
          pip install ".[all]" --no-cache-dir
          $env:PYTHONIOENCODING='utf-8'
          gptc
          $env:GPTC_LOG_LEVEL='ERROR'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        id: test
        run: |
          $env:PYTHONIOENCODING='utf-8'
          pytest --timeout=360 -v -s --ignore-glob='tests/integration/hub_usage/dummyhub*' ${{ matrix.test-path }}
        timeout-minutes: 20
        env:
          GPTCHUB_USERNAME: ${{ secrets.GPTCHUB_USERNAME }}
          GPTCHUB_PASSWORD: ${{ secrets.GPTCHUB_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: eventName,job
          text: |
            :no_entry: pytest run for `${{ matrix.test-path }}` failed on :windows:
          author_name: Nightly tests
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_TESTS_WEBHOOK }}
          MATRIX_CONTEXT: ${{ toJson(matrix) }}

  install-gptc-ecosystem-test:
    runs-on: ubuntu-latest
    needs: prep-testbed
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Prepare enviroment
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel

          HUBBLE_VERSION=$(curl -L -s "https://pypi.org/pypi/gptc-hubble-sdk/json" |  jq  -r '.releases | keys | .[]| select(startswith("0."))'  | sort -V | tail -1)
          DOCARRAY_VERSION=$(curl -L -s "https://pypi.org/pypi/docarray/json" |  jq  -r '.releases | keys | .[]| select(startswith("0."))'  | sort -V | tail -1)
          JCLOUD_VERSION=$(curl -L -s "https://pypi.org/pypi/jcloud/json" |  jq  -r '.releases | keys | .[]| select(startswith("0."))'  | sort -V | tail -1)

          pip install . jcloud==$JCLOUD_VERSION docarray==$DOCARRAY_VERSION gptc-hubble-sdk==$HUBBLE_VERSION

      - name: Test basic import
        run: python -c 'from gptc import Executor,requests'
      - name: Test import all
        run: python -c 'from gptc import *'

  success-all-test:
    needs: [prep-testbed, windows-test, install-gptc-ecosystem-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: technote-space/workflow-conclusion-action@v2
      - name: Check Failure
        if: env.WORKFLOW_CONCLUSION == 'failure'
        run: exit 1
      - name: Success
        if: ${{ success() }}
        run: echo "All Done"
