[build-system]
requires = ["setuptools>=18.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gptc"
readme = "README.md"
requires-python = ">=3.8,<3.13"
dynamic = ["version", "description", "dependencies", "optional-dependencies", "scripts", "entry-points", "authors", "license", "classifiers", "keywords", "urls"]

[dependency-groups]
test = [
    "pytest<8.0.0",
    "pytest-timeout",
    "pytest-mock",
    "pytest-cov==3.0.0",
    "coverage==6.2",
    "pytest-repeat",
    "pytest-asyncio<0.23.0",
    "pytest-reraise",
    "flaky",
    "mock",
    "requests-mock",
    "pytest-custom_exit_code",
    "black==24.3.0",
    "kubernetes>=18.20.0,<31.0.0",
    "pytest-kind==22.11.1",
    "pytest-lazy-fixture",
    "scipy>=1.6.1",
    "Pillow",
    "psutil",
    "opentelemetry-test-utils>=0.33b0",
    "prometheus-api-client>=0.5.1",
]
devel = [
    "pre-commit",
    "setuptools<81",
    "watchfiles>=0.18.0",
    "strawberry-graphql>=0.96.0",
    "sgqlc",
]
cicd = [
    "torch",
    "strawberry-graphql>=0.96.0",
    "sgqlc",
    "bs4",
    "jsonschema",
    "portforward>=0.2.4,<0.4.3",
    "tensorflow>=2.0",
]
dev = [
    {include-group = "test"},
    {include-group = "devel"},
]

[tool.uv]
default-groups = ["dev"]
exclude-dependencies = ["gptc-hubble-sdk"]
constraint-dependencies = ["docarray<0.22", "pydantic<2"]

[tool.uv.sources]
gptc-hubble-sdk = { git = "https://github.com/gpt-computer/gptc-hubble-sdk" }

[tool.black]
line-length = 88
skip-string-normalization = true
extend-exclude = "gptc/proto|gptc/serve/consensus/add_voter|docs/conf.py"

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
