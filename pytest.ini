[pytest]
faulthandler_timeout=180
testpaths =
    tests/unit
    tests/integration
asyncio_mode=strict
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    timeout: marks test timeout duration
    asyncio: marks that run async tests
    repeat: marks that test run n times
    k8s: marks tests that require a Kubernetes cluster (deselect with '-m "not k8s"')
    docker_compose: marks tests that require Docker Compose (deselect with '-m "not docker_compose"')
    ignore: legacy no-op marker kept for compatibility
